<title>FHB Fit Assessment</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f4;
    --surface: #ffffff;
    --surface-2: #eef1ec;
    --ink: #1a2420;
    --muted: #5c6660;
    --faint: #8a938c;
    --line: #dde2db;
    --line-strong: #c9d0c6;
    --accent: #0f6b5c;
    --accent-ink: #0a5145;
    --accent-soft: #dcebe6;
    --good: #2f7d52;
    --good-soft: #dcefe2;
    --warn: #a86a12;
    --warn-soft: #f4e8d2;
    --crit: #b4443a;
    --crit-soft: #f5ddd9;
    --shadow: 0 1px 2px rgba(20,36,30,.05), 0 8px 24px -12px rgba(20,36,30,.18);
    --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    --r: 12px;
    --r-sm: 8px;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #0f1512;
      --surface: #161d19;
      --surface-2: #1d2621;
      --ink: #e9efea;
      --muted: #9fab9f;
      --faint: #74807a;
      --line: #29332d;
      --line-strong: #35423a;
      --accent: #46c4aa;
      --accent-ink: #6fd6c0;
      --accent-soft: #16302a;
      --good: #4fb37a;
      --good-soft: #16301f;
      --warn: #d69a3f;
      --warn-soft: #33280f;
      --crit: #e06b5f;
      --crit-soft: #341915;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1512;
    --surface: #161d19;
    --surface-2: #1d2621;
    --ink: #e9efea;
    --muted: #9fab9f;
    --faint: #74807a;
    --line: #29332d;
    --line-strong: #35423a;
    --accent: #46c4aa;
    --accent-ink: #6fd6c0;
    --accent-soft: #16302a;
    --good: #4fb37a;
    --good-soft: #16301f;
    --warn: #d69a3f;
    --warn-soft: #33280f;
    --crit: #e06b5f;
    --crit-soft: #341915;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px 96px; }

  /* Header */
  header.masthead {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .masthead-inner {
    max-width: 820px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; gap: 14px;
  }
  .mark {
    font-family: var(--font-display);
    font-weight: 600; font-size: 1.15rem; letter-spacing: .2px;
    display: flex; align-items: baseline; gap: 9px; white-space: nowrap;
  }
  .mark .dot { color: var(--accent); }
  .mark small {
    font-family: var(--font-ui); font-weight: 600; font-size: .62rem;
    letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }
  .theme-toggle {
    margin-left: auto; border: 1px solid var(--line-strong); background: var(--surface);
    color: var(--muted); border-radius: 999px; width: 34px; height: 34px; cursor: pointer;
    font-size: .95rem; display: grid; place-items: center; transition: .15s;
  }
  .theme-toggle:hover { color: var(--ink); border-color: var(--accent); }

  /* Progress rail */
  .rail { display: flex; gap: 6px; margin: 22px 0 30px; }
  .rail .seg {
    flex: 1; height: 5px; border-radius: 999px; background: var(--surface-2);
    overflow: hidden;
  }
  .rail .seg > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }
  .rail .seg.done > i { width: 100%; }
  .rail .seg.active > i { width: 100%; opacity: .45; }
  .steplabel { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 600; margin-bottom: 6px; }

  /* Typography */
  h1.title { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.7rem, 4.5vw, 2.5rem); line-height: 1.1; margin: 0 0 10px; text-wrap: balance; }
  h2.sec { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; margin: 0 0 4px; text-wrap: balance; }
  .lede { color: var(--muted); font-size: 1.02rem; max-width: 60ch; }
  .eyebrow { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-ink); font-weight: 700; margin-bottom: 10px; }
  :root[data-theme="dark"] .eyebrow, :root:not([data-theme="light"]) .eyebrow { color: var(--accent); }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 22px; box-shadow: var(--shadow); margin: 16px 0;
  }
  .q {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 18px 20px; margin: 12px 0; transition: border-color .15s, box-shadow .15s;
  }
  .q.answered { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .q .qnum { font-family: var(--font-mono); font-size: .74rem; color: var(--accent-ink); font-weight: 700; }
  :root[data-theme="dark"] .q .qnum, :root:not([data-theme="light"]) .q .qnum { color: var(--accent); }
  .q .qtext { font-weight: 500; margin: 3px 0 14px; }
  .q .qtext .lead { color: var(--muted); font-weight: 400; }

  /* MC choices */
  .choices { display: grid; gap: 8px; }
  .choice {
    display: flex; align-items: center; gap: 11px; padding: 11px 14px; cursor: pointer;
    border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface);
    transition: .13s; font-size: .96rem;
  }
  .choice:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice .tick {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-strong);
    flex: none; display: grid; place-items: center; transition: .13s;
  }
  .choice input:checked ~ .tick { border-color: var(--accent); background: var(--accent); }
  .choice input:checked ~ .tick::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; }
  .choice input:checked ~ * { }
  .choice:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 60%, var(--surface)); font-weight: 500; }
  .choice .key { font-family: var(--font-mono); font-size: .78rem; color: var(--faint); font-weight: 600; }

  /* Number input */
  .numrow { display: flex; align-items: center; gap: 10px; }
  .numrow input {
    font-family: var(--font-mono); font-size: 1rem; padding: 11px 14px; width: 220px; max-width: 100%;
    border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); color: var(--ink);
  }
  .numrow input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .numrow .hint { font-size: .8rem; color: var(--faint); }

  /* Likert */
  .likert { display: flex; gap: 6px; flex-wrap: wrap; }
  .likert label {
    flex: 1; min-width: 58px; text-align: center; cursor: pointer;
    border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 9px 4px 8px;
    transition: .12s; user-select: none;
  }
  .likert label:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 40%, var(--surface)); }
  .likert input { position: absolute; opacity: 0; pointer-events: none; }
  .likert label .n { font-family: var(--font-mono); font-weight: 700; font-size: 1rem; display: block; }
  .likert label .t { font-size: .62rem; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
  .likert label:has(input:checked) { border-color: var(--accent); background: var(--accent); color: #fff; }
  .likert label:has(input:checked) .t { color: rgba(255,255,255,.85); }
  .scale-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 3px; }
  .scale-head .name { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; }
  .scale-head .poles { font-size: .74rem; color: var(--faint); font-variant: small-caps; letter-spacing: .03em; }
  .trait-block { margin: 26px 0; }
  .trait-block .items { display: grid; gap: 10px; }

  /* Interests rank */
  .int-grid { display: grid; gap: 10px; }
  .int-opt {
    display: flex; align-items: center; gap: 14px; padding: 13px 16px; cursor: pointer;
    border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); transition: .13s;
  }
  .int-opt:hover { border-color: var(--accent); }
  .int-opt[data-picked="1"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); }
  .int-opt .rankbadge {
    width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center;
    border: 1.5px dashed var(--line-strong); font-family: var(--font-mono); font-weight: 700; color: var(--faint); font-size: .9rem;
  }
  .int-opt[data-picked="1"] .rankbadge { border-style: solid; border-color: var(--accent); background: var(--accent); color: #fff; }
  .int-opt .body b { display: block; }
  .int-opt .body span { font-size: .84rem; color: var(--muted); }

  /* Role select */
  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 20px 0; }
  @media (max-width: 560px){ .roles { grid-template-columns: 1fr; } }
  .role {
    text-align: left; cursor: pointer; padding: 20px; border-radius: var(--r);
    border: 1.5px solid var(--line-strong); background: var(--surface); transition: .15s; font: inherit; color: inherit;
  }
  .role:hover { border-color: var(--accent); transform: translateY(-1px); }
  .role[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); box-shadow: var(--shadow); }
  .role h3 { margin: 0 0 4px; font-family: var(--font-display); font-size: 1.25rem; }
  .role p { margin: 0; font-size: .88rem; color: var(--muted); }
  .field { margin: 18px 0; }
  .field label { display: block; font-size: .82rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 14px; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
    background: var(--surface); color: var(--ink); font: inherit;
  }
  .field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  /* Buttons + nav */
  .navbar {
    position: sticky; bottom: 0; z-index: 15; margin-top: 26px;
    background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px);
    border-top: 1px solid var(--line); padding: 14px 0;
    display: flex; align-items: center; gap: 12px;
  }
  .btn {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: var(--r-sm);
    padding: 12px 22px; border: 1px solid transparent; transition: .14s; display: inline-flex; align-items: center; gap: 8px;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-ink); }
  .btn.primary:disabled { background: var(--surface-2); color: var(--faint); cursor: not-allowed; border-color: var(--line); }
  .btn.ghost { background: transparent; color: var(--muted); border-color: var(--line-strong); }
  .btn.ghost:hover { color: var(--ink); border-color: var(--accent); }
  .counter { margin-left: auto; font-size: .84rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .counter b { color: var(--ink); font-family: var(--font-mono); }
  .btn:focus-visible, .choice:focus-within, .role:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Results */
  .verdict {
    border-radius: var(--r); padding: 26px; margin: 8px 0 20px; border: 1px solid var(--line);
    display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center;
  }
  @media (max-width: 560px){ .verdict { grid-template-columns: 1fr; gap: 14px; } }
  .verdict .big { font-family: var(--font-mono); font-weight: 700; font-size: 3.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .verdict .pct { font-size: 1.4rem; color: var(--muted); }
  .verdict.good { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
  .verdict.good .big { color: var(--good); }
  .verdict.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
  .verdict.warn .big { color: var(--warn); }
  .verdict.crit { background: var(--crit-soft); border-color: color-mix(in srgb, var(--crit) 40%, var(--line)); }
  .verdict.crit .big { color: var(--crit); }
  .verdict .call { font-family: var(--font-display); font-size: 1.7rem; font-weight: 600; margin: 0 0 2px; }
  .verdict .sub { color: var(--muted); font-size: .95rem; }

  .breakdown { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin: 16px 0; }
  @media (max-width: 560px){ .breakdown { grid-template-columns: 1fr; } }
  .metric { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 15px 16px; }
  .metric .lab { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .metric .val { font-family: var(--font-mono); font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .metric .wt { font-size: .78rem; color: var(--muted); }
  .metric .bar { height: 5px; background: var(--surface-2); border-radius: 999px; margin-top: 9px; overflow: hidden; }
  .metric .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

  .track-row { display: grid; grid-template-columns: 150px 1fr auto; gap: 14px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
  @media (max-width: 560px){ .track-row { grid-template-columns: 1fr; gap: 4px; } }
  .track-row .tname { font-weight: 600; font-size: .92rem; }
  .track-row .tname small { display: block; color: var(--faint); font-weight: 400; font-size: .72rem; font-variant: small-caps; }
  .track { position: relative; height: 26px; }
  .track .grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(10,1fr); }
  .track .grid span { border-right: 1px solid var(--line); }
  .track .grid span:last-child { border-right: 0; }
  .track .band { position: absolute; top: 4px; bottom: 4px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 5px; }
  .track .marker { position: absolute; top: -2px; width: 3px; height: 30px; border-radius: 2px; background: var(--ink); transform: translateX(-50%); }
  .track .marker::after { content: attr(data-v); position: absolute; top: -17px; left: 50%; transform: translateX(-50%); font-family: var(--font-mono); font-size: .7rem; font-weight: 700; color: var(--ink); }
  .fitflag { font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .fitflag.in { background: var(--good-soft); color: var(--good); }
  .fitflag.near { background: var(--warn-soft); color: var(--warn); }
  .fitflag.out { background: var(--crit-soft); color: var(--crit); }

  .pillrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 2px; }
  .pill { font-size: .82rem; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); }
  .pill.match { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); color: var(--good); font-weight: 600; }
  .pill.rank { font-family: var(--font-mono); }

  .flagbox { border-radius: var(--r); padding: 18px 20px; margin: 14px 0; border: 1px solid var(--line); background: var(--surface); }
  .flagbox.on { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
  .flagbox.off { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 30%, var(--line)); }
  .flagbox .ft { font-weight: 700; display: flex; align-items: center; gap: 8px; }

  .guide { display: grid; gap: 12px; }
  .gitem { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--r-sm); padding: 14px 16px; background: var(--surface); }
  .gitem .gtag { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); font-weight: 700; }
  :root[data-theme="dark"] .gitem .gtag, :root:not([data-theme="light"]) .gitem .gtag { color: var(--accent); }
  .gitem .gq { font-weight: 600; margin: 4px 0 6px; }
  .gitem .gl { font-size: .86rem; color: var(--muted); }
  .gitem .gl b { color: var(--ink); font-weight: 600; }

  .muted-note { font-size: .84rem; color: var(--muted); background: var(--surface-2); border-radius: var(--r-sm); padding: 12px 15px; }
  .rep-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin-bottom: 4px; color: var(--muted); font-size: .88rem; }
  .rep-head b { color: var(--ink); }
  .hr { height: 1px; background: var(--line); border: 0; margin: 30px 0; }
  h3.block { font-family: var(--font-display); font-size: 1.2rem; margin: 26px 0 4px; }
  .block-sub { color: var(--muted); font-size: .88rem; margin: 0 0 12px; }
  .hidden { display: none !important; }

  @media print {
    header.masthead, .navbar, .theme-toggle, .rail, .steplabel, #printBtn, #restartBtn { display: none !important; }
    body { background: #fff; color: #000; }
    .card, .q, .metric, .gitem, .flagbox, .verdict { box-shadow: none; break-inside: avoid; }
  }
</style>

<header class="masthead">
  <div class="masthead-inner">
    <span class="mark">FHB<span class="dot">·</span>Fit <small>Assessment</small></span>
    <button class="theme-toggle" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">◑</button>
  </div>
</header>

<main class="wrap">
  <div class="steplabel" id="stepLabel">Step 1 of 5</div>
  <div class="rail" id="rail" aria-hidden="true"></div>
  <div id="screen"></div>
  <div class="navbar" id="navbar"></div>
</main>

<script>
/* ============================ DATA ============================ */
const COG = [
  // A1 Verbal Skill
  {id:'c1', sub:'Verbal Skill', type:'mc', q:'Choose the word closest in meaning to <b>CONCEDE</b>.', choices:['refuse','admit / yield','delay','argue'], answer:1},
  {id:'c2', sub:'Verbal Skill', type:'mc', q:'Choose the word closest in meaning to <b>PRUDENT</b>.', choices:['reckless','wealthy','careful','rude'], answer:2},
  {id:'c3', sub:'Verbal Skill', type:'mc', q:'Choose the word closest in meaning to <b>MITIGATE</b>.', choices:['worsen','lessen','confuse','repeat'], answer:1},
  {id:'c4', sub:'Verbal Skill', type:'mc', q:'Choose the word closest in meaning to <b>CANDID</b>.', choices:['sweet','hidden','frank','nervous'], answer:2},
  {id:'c5', sub:'Verbal Skill', type:'mc', q:'Choose the word closest in meaning to <b>TENTATIVE</b>.', choices:['certain','provisional','permanent','hostile'], answer:1},
  {id:'c6', sub:'Verbal Skill', type:'mc', q:'Choose the word closest in meaning to <b>DISCREPANCY</b>.', choices:['agreement','discount','inconsistency','delay'], answer:2},
  // A2 Verbal Reasoning
  {id:'c7', sub:'Verbal Reasoning', type:'mc', q:'<span class="lead">A seller will only accept an all-cash offer that closes in 14 days. Our buyer needs 21 days.</span> Which is best supported?', choices:['The deal is dead.','The buyer must be all-cash.','The timeline, not the price, is the current obstacle.','The seller wants more money.'], answer:2},
  {id:'c8', sub:'Verbal Reasoning', type:'mc', q:'<span class="lead">Every lead from Channel X this month was a wrong number or a renter. Channel Y produced 3 contracts.</span> A reasonable conclusion:', choices:['Channel X should get more budget.','Channel Y converts and X is not producing sellers.','Renters never sell.','Channel Y is cheaper.'], answer:1},
  {id:'c9', sub:'Verbal Reasoning', type:'mc', q:'<span class="lead">"We can assign this contract only if the purchase agreement has no anti-assignment clause." The contract has such a clause.</span> Therefore:', choices:['We can still assign it.','We cannot assign it as written.','The clause is unenforceable.','We must close ourselves — always.'], answer:1},
  {id:'c10', sub:'Verbal Reasoning', type:'mc', q:'<span class="lead">All of our best months followed weeks where reps made 250+ dials. Last week reps made 90 dials.</span> Most defensible statement:', choices:['This month will be bad.','Dials guarantee deals.','Activity was below the level historically tied to strong months.','Reps are lazy.'], answer:2},
  {id:'c11', sub:'Verbal Reasoning', type:'mc', q:'<span class="lead">A homeowner says "I\'m not interested" but keeps asking what the house is worth.</span> Best inference:', choices:['Hang up.','There may be latent interest worth exploring.','They want a free appraisal only.','They\'re a competitor.'], answer:1},
  {id:'c12', sub:'Verbal Reasoning', type:'mc', q:'<span class="lead">If ARV is $300k and we need 30% margin plus $40k rehab, then a $170k offer…</span>', choices:['exceeds our max.','is within a defensible range.','cannot be evaluated.','ignores rehab.'], answer:1},

const COG_BANDS = [[22,24,10],[20,21,9],[18,19,8],[16,17,7],[14,15,6],[12,13,5],[10,11,4],[8,9,3],[6,7,2],[0,5,1]];
const STEPS = ['Role','Thinking Style','Behavioral','Interests','Results'];

/* ============================ STATE ============================ */
const state = { step:0, role:null, name:'', date:new Date().toISOString().slice(0,10), cog:{}, beh:{}, intOrder:[] };

/* ============================ HELPERS ============================ */
function stenFromRaw(raw){
  if(raw<=5) return 1; if(raw<=7) return 2; if(raw<=8) return 3; if(raw<=10) return 4;
  if(raw<=11) return 5; if(raw<=13) return 6; if(raw<=14) return 7; if(raw<=16) return 8;
  if(raw<=18) return 9; return 10;
}
function cogIndex(correct){ for(const[lo,hi,idx] of COG_BANDS){ if(correct>=lo&&correct<=hi) return idx; } return 1; }
function normNum(v){ if(v==null) return NaN; const s=String(v).replace(/[^0-9.\-]/g,''); return s===''?NaN:parseFloat(s); }

function traitSten(key){
  const tr = TRAITS.find(t=>t.key===key);
  let raw=0;
  tr.items.forEach((it,i)=>{ const resp=state.beh[key+'_'+i]; const v=it.r?(6-resp):resp; raw+=v; });
  return {sten:stenFromRaw(raw), raw};
}

/* ============================ SCORING ============================ */
function compute(){
  const model = MODELS[state.role];
  // Cognitive
  let correct=0; const subCounts={};
  COG.forEach(item=>{
    subCounts[item.sub]=subCounts[item.sub]||{c:0,n:0}; subCounts[item.sub].n++;
    const a=state.cog[item.id]; let ok=false;
    if(item.type==='mc') ok = (a===item.answer);
    else ok = (Math.abs(normNum(a)-item.answer) < 0.5);
    if(ok){ correct++; subCounts[item.sub].c++; }
  });
  const idx = cogIndex(correct);
  const [clo,chi]=model.cog;
  let aFit;
  if(idx>=clo && idx<=chi) aFit=100;
  else if(idx<clo) aFit=Math.max(0,100-30*(clo-idx));
  else aFit=100;

  // Behavioral
  const traitResults=[]; let bSum=0;
  TRAITS.forEach(tr=>{
    const {sten,raw}=traitSten(tr.key);
    const [lo,hi]=model.traits[tr.key];
    let s, flag;
    if(sten>=lo&&sten<=hi){ s=1; flag='in'; }
    else if(sten===lo-1||sten===hi+1){ s=0.5; flag='near'; }
    else { s=0; flag='out'; }
    bSum+=s;
    traitResults.push({key:tr.key, low:tr.low, high:tr.high, sten, raw, lo, hi, flag});
  });
  const bFit = (bSum/TRAITS.length)*100;

  // Interests
  const top3 = state.intOrder.slice(0,3);
  const matches = top3.filter(k=>model.interests.includes(k));
  const cFit = (matches.length/3)*100;

  const overall = aFit*0.4 + bFit*0.4 + cFit*0.2;

  // Distortion
  let inconsistent=0;
  TRAITS.forEach(tr=>{
    let nonRev=[], rev=null;
    tr.items.forEach((it,i)=>{ const resp=state.beh[tr.key+'_'+i]; if(it.r) rev=resp; else nonRev.push(resp); });
    const avg=nonRev.reduce((a,b)=>a+b,0)/nonRev.length;
    if((avg>=4&&rev>=4)||(avg<=2&&rev<=2)) inconsistent++;
  });
  const allResp=Object.values(state.beh);
  const highCount=allResp.filter(v=>v>=4).length;
  const lowCount=allResp.filter(v=>v<=2).length;
  const allInZone=traitResults.every(t=>t.flag==='in');
  const extreme = highCount>=30 && lowCount<=2 && allInZone;
  const distortion = inconsistent>=3 || extreme;

  return {correct, subCounts, idx, aFit, traitResults, bFit, top3, matches, cFit, overall, distortion, inconsistent, extreme, model};
}

/* ============================ COMPLETION / NAV ============================ */
function complete(){
  if(state.step===0) return !!state.role;
  if(state.step===1) return COG.every(i=>state.cog[i.id]!=null && String(state.cog[i.id]).trim()!=='');
  if(state.step===2) return Object.keys(state.beh).length===TRAITS.length*4;
  if(state.step===3) return state.intOrder.length===6;
  return true;
}
function remaining(){
  if(state.step===1) return COG.length-COG.filter(i=>state.cog[i.id]!=null&&String(state.cog[i.id]).trim()!=='').length;
  if(state.step===2) return TRAITS.length*4-Object.keys(state.beh).length;
  if(state.step===3) return 6-state.intOrder.length;
  return 0;
}
function updateNav(){
  const nav=$('#navbar');
  if(state.step===4){ nav.innerHTML=''; return; }
  const isLastInput = state.step===3;
  const rem=remaining();
  const counter = state.step>=1&&state.step<=3 ? `<span class="counter"><b>${rem}</b> item${rem===1?'':'s'} left</span>` : '';
  nav.innerHTML = `
    ${state.step>0?'<button class="btn ghost" id="backBtn">← Back</button>':''}
    ${counter}
    <button class="btn primary" id="nextBtn" ${complete()?'':'disabled'}>${isLastInput?'See results →':'Continue →'}</button>`;
  const back=$('#backBtn'); if(back) back.addEventListener('click',()=>go(state.step-1));
  $('#nextBtn').addEventListener('click',()=>go(state.step+1));
}
function go(step){
  if(step>state.step && !complete()) return;
  state.step=step;
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}
function render(){
  renderRail();
  if(state.step===0) screenRole();
  else if(state.step===1) screenCog();
  else if(state.step===2) screenBeh();
  else if(state.step===3) screenInt();
  else screenResults();
  updateNav();
}

/* ============================ RESULTS ============================ */
function verdictOf(overall, distortion){
  if(overall>=80) return distortion
    ? {cls:'warn', call:'Advance — with a distortion check', sub:'Strong fit, but the honesty check flagged. Confirm the "perfect" traits in the interview before advancing.'}
    : {cls:'good', call:'Advance', sub:'Fit is at or above the 80% bar against this model.'};
  if(overall>=65) return {cls:'warn', call:'Conditional — clear the gaps first', sub:'Advance only if the interview resolves every flagged gap below.'};
  return {cls:'crit', call:'Do not advance', sub:'Fit is below 65% against this model. Combined with a weak interview, this is an out.'};
}

    <div class="flagbox ${r.distortion?'on':'off'}">
      <div class="ft">${r.distortion?'⚠ Possible impression management':'✓ No distortion indicated'}</div>
      <p class="sub" style="margin:6px 0 0;color:var(--muted);font-size:.9rem">${r.distortion
        ? `Response patterns suggest the candidate may be answering for the job rather than honestly (${r.inconsistent} contradictory trait pair${r.inconsistent===1?'':'s'}${r.extreme?', plus an unusually flawless profile':''}). This is a probability, not proof — lean harder on the interview and re-probe the "perfect" traits. Do not auto-reject.`
        : 'Reverse-scored items moved consistently and the profile is not implausibly flawless. Treat self-report at face value.'}</p>
    </div>

    <hr class="hr">
    <h3 class="block">Interview guide — targeted at each gap</h3>
    <p class="block-sub">Auto-generated for every scale where the candidate landed outside the model. Structure the final interview around these.</p>
    ${buildGuide(r)}

    <div class="navbar" style="border-top:1px solid var(--line)">
      <button class="btn ghost" id="restartBtn">↺ New assessment</button>
      <button class="btn primary" id="printBtn" style="margin-left:auto">⎙ Print / save report</button>
    </div>`;
  screen.innerHTML=html;
  $('#restartBtn').addEventListener('click',()=>{
    Object.assign(state,{step:0,role:null,name:'',cog:{},beh:{},intOrder:[]});
    render();
  });
  $('#printBtn').addEventListener('click',()=>window.print());
}
function metric(lab,fit,wt,contrib){
  return `<div class="metric"><div class="lab">${lab}</div><div class="val">${Math.round(fit)}%</div>
    <div class="wt">${wt} → +${Math.round(contrib)} pts</div>
    <div class="bar"><i style="width:${Math.max(2,Math.round(fit))}%"></i></div></div>`;
}
function trackRow(t){
  const bandL=(t.lo-1)/10*100, bandW=(t.hi-t.lo+1)/10*100;
  const mk=(t.sten-0.5)/10*100;
  const flagTxt={in:'In range',near:'1 off',out:'Gap'}[t.flag];
  return `<div class="track-row">
    <div class="tname">${t.key}<small>${t.low} ↔ ${t.high}</small></div>
    <div class="track"><div class="grid">${'<span></span>'.repeat(10)}</div>
      <div class="band" style="left:${bandL}%;width:${bandW}%"></div>
      <div class="marker" data-v="${t.sten}" style="left:${mk}%"></div></div>
    <span class="fitflag ${t.flag}">${flagTxt}</span></div>`;
}
function buildGuide(r){
  const items=[];
  if(r.idx<r.model.cog[0]) items.push({tag:'Cognitive', ...GUIDE.cog});
  r.traitResults.forEach(t=>{ if(t.flag!=='in') items.push({tag:t.key+(t.sten<t.lo?' — too low':' — too high'), ...GUIDE[t.key]}); });
  if(r.matches.length<3) items.push({tag:'Interest mismatch', ...GUIDE.interest});
  if(r.distortion) items.push({tag:'Distortion flagged', ...GUIDE.distortion});
  if(!items.length) return `<div class="muted-note">No gaps — the candidate landed inside every model range. Use the interview to confirm track record and motivation.</div>`;
  return `<div class="guide">${items.map(it=>`<div class="gitem"><div class="gtag">${it.tag}</div><div class="gq">${it.q}</div><div class="gl"><b>Listen for:</b> ${it.l}</div></div>`).join('')}</div>`;
}

/* ============================ THEME ============================ */
(function(){
  const btn=$('#themeBtn');
  btn.addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const next = cur==='dark'?'light':(cur==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark'));
    document.documentElement.setAttribute('data-theme',next);
  });
})();

/* ============================ INIT ============================ */
render();
</script>
