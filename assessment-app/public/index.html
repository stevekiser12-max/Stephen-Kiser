<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FHB Fit Assessment</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <span class="mark">FHB<span class="dot">·</span>Fit <small>Assessment</small></span>
      <span class="spacer"></span>
      <button class="theme-toggle" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">◑</button>
    </div>
  </header>
  <main class="wrap">
    <div class="steplabel" id="stepLabel"></div>
    <div class="rail" id="rail" aria-hidden="true"></div>
    <div id="screen"></div>
    <div class="navbar" id="navbar"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
